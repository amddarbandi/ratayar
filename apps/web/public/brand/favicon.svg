<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="rgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="rtrail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- R body — flowing calligraphic form -->
  <path
    d="M 14 52 L 14 12 L 34 12 Q 46 12 46 24 Q 46 34 36 35 L 46 52"
    stroke="url(#rgrad)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Trail curves inspired by network propagation -->
  <path
    d="M 46 24 Q 56 24 56 34"
    stroke="url(#rtrail)"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M 44 32 Q 58 32 58 44"
    stroke="url(#rtrail)"
    stroke-width="2.5"
    stroke-linecap="round"
    fill="none"
    opacity="0.7"
  />
  <path
    d="M 42 40 Q 60 40 60 52"
    stroke="url(#rtrail)"
    stroke-width="2"
    stroke-linecap="round"
    fill="none"
    opacity="0.4"
  />

  <!-- Node dots on trail tips -->
  <circle cx="56" cy="34" r="2.5" fill="#06b6d4"/>
  <circle cx="58" cy="44" r="2" fill="#22d3ee" opacity="0.75"/>
  <circle cx="60" cy="52" r="1.5" fill="#67e8f9" opacity="0.5"/>
</svg>
